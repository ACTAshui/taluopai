<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="星幕塔罗是一个默认无需 API 的公开静态塔罗占卜网页，使用 Web Crypto 和 Fisher-Yates 洗牌。"
    />
    <title>星幕塔罗 Astral Veil Tarot</title>
    <link rel="icon" href="./assets/cards/tarot-back.webp" />
    <link rel="stylesheet" href="./styles.css?v=20260603-ritual3" />
  </head>
  <body data-topic="daily">
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="sigil-button" id="hiddenApiTrigger" type="button" aria-label="星盘">
          <span class="sigil-ring"></span>
          <span class="sigil-core"></span>
        </button>
        <div class="brand-lockup">
          <p class="eyebrow">Web Crypto · Local Reading</p>
          <h1>星幕塔罗</h1>
        </div>
        <div class="topbar-actions">
          <a class="ghost-button page-link" href="./zhouyi.html">玄衡易台</a>
          <button class="raven-button" id="ravenButton" type="button" aria-label="星幕守望者">
            <span class="raven-aura" aria-hidden="true"></span>
            <img class="raven-avatar" src="./assets/animals/raven-generated.png" alt="" />
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="ritual-panel" aria-label="占卜设置">
          <div class="intro-copy">
            <p class="kicker">把问题放到桌面上，让牌慢慢回应。</p>
            <p class="topic-oracle" id="topicOracle">今日指引会把答案收束成一个可执行的小动作。</p>
          </div>

          <div class="control-group">
            <div class="group-heading">
              <span>问题类型</span>
              <small>切换牌桌氛围</small>
            </div>
            <div class="segmented-grid" id="topicOptions"></div>
          </div>

          <label class="question-field">
            <span>你的问题</span>
            <textarea
              id="questionInput"
              rows="3"
              maxlength="180"
              placeholder="例如：这段关系接下来要注意什么？我现在最需要看见的问题是什么？"
            ></textarea>
          </label>

          <div class="control-group">
            <div class="group-heading">
              <span>牌阵</span>
              <small>决定发牌节奏</small>
            </div>
            <div class="spread-list" id="spreadOptions"></div>
          </div>

          <div class="ritual-actions">
            <button class="ghost-button" id="resetButton" type="button">清空重来</button>
          </div>

        </section>

        <section class="table-stage" aria-label="塔罗牌桌">
          <div class="deck-zone">
            <div class="deck-control">
              <div class="deck-stack" id="deckStack" aria-hidden="true">
                <img src="./assets/cards/tarot-back.webp" alt="" />
                <span></span>
                <span></span>
              </div>
              <div class="shuffle-ritual" aria-hidden="true">
                <span class="shuffle-ring ring-one"></span>
                <span class="shuffle-ring ring-two"></span>
                <span class="shuffle-spark spark-a"></span>
                <span class="shuffle-spark spark-b"></span>
                <span class="shuffle-spark spark-c"></span>
                <span class="shuffle-card card-a"></span>
                <span class="shuffle-card card-b"></span>
                <span class="shuffle-card card-c"></span>
              </div>
              <button class="primary-button deck-shuffle-button" id="shuffleButton" type="button">
                <span class="button-sigil" aria-hidden="true"></span>
                开始洗牌
              </button>
            </div>
            <div class="stage-status" id="stageStatus">请先进行洗牌</div>
          </div>

          <div class="stage-magic-circle" aria-hidden="true">
            <span class="stage-circle circle-outer"></span>
            <span class="stage-circle circle-middle"></span>
            <span class="stage-circle circle-inner"></span>
            <span class="stage-rune rune-a"></span>
            <span class="stage-rune rune-b"></span>
            <span class="stage-rune rune-c"></span>
            <span class="stage-falling-card falling-one"></span>
            <span class="stage-falling-card falling-two"></span>
            <span class="stage-falling-card falling-three"></span>
          </div>

          <div class="spread-board" id="spreadBoard"></div>
          <div class="result-cue" id="resultCue" hidden aria-hidden="true">
            <div class="result-cue-sigil">
              <span class="result-cue-orbit"></span>
              <span class="result-cue-arrow"></span>
            </div>
          </div>
        </section>
      </main>

      <section class="result-area" id="resultArea" aria-live="polite"></section>
    </div>

    <dialog id="randomDialog" class="modal-shell">
      <form method="dialog">
        <button class="modal-close" type="submit" aria-label="关闭">×</button>
      </form>
      <h2>随机机制</h2>
      <p>
        本站洗牌使用浏览器 Web Crypto 随机源，并通过无偏 Fisher-Yates 洗牌算法完成。
        本站不使用 Math.random，不上传你的问题，也不调用外部解读 API。
      </p>
      <dl class="status-grid">
        <div><dt>随机源</dt><dd id="cryptoStatus">检测中</dd></div>
        <div><dt>洗牌算法</dt><dd>Fisher-Yates</dd></div>
        <div><dt>运行时 API</dt><dd>默认无</dd></div>
        <div><dt>本地存储</dt><dd>默认关闭</dd></div>
      </dl>
      <pre id="drawRecord" class="record-view">尚未抽牌。</pre>
    </dialog>

    <dialog id="apiDialog" class="modal-shell api-modal">
      <form method="dialog">
        <button class="modal-close" type="submit" aria-label="关闭">×</button>
      </form>
      <h2>隐藏 AI 接口</h2>
      <p class="warning-copy">
        默认不会启用。仅用于本机使用，不会公开。
      </p>
      <div class="api-grid">
        <label>
          <span>供应商</span>
          <select id="providerSelect"></select>
        </label>
        <label>
          <span>模型</span>
          <input id="apiModelInput" autocomplete="off" />
        </label>
        <label class="wide-field">
          <span>接口地址</span>
          <input id="apiEndpointInput" autocomplete="off" />
        </label>
        <label>
          <span>API key</span>
          <input id="apiKeyInput" type="password" autocomplete="off" placeholder="只保存到本机浏览器" />
        </label>
        <label>
          <span>调用状态</span>
          <select id="apiEnabledSelect">
            <option value="off">关闭</option>
            <option value="on">启用 AI 补充解读</option>
          </select>
        </label>
        <label class="wide-field">
          <span>系统提示词</span>
          <textarea id="apiPromptInput" rows="4"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button class="primary-button" id="saveApiConfig" type="button">保存到本机</button>
        <button class="ghost-button" id="clearApiConfig" type="button">清除本机配置</button>
      </div>
      <p class="api-note" id="providerNote"></p>
    </dialog>

    <script type="module" src="./src/ui/app.js?v=20260603-ritual3"></script>
  </body>
</html>

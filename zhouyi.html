<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="玄衡易台支持六爻铜钱、小六壬与梅花易数，默认在浏览器本地起课，并可选择补充解读。"
    />
    <title>玄衡易台 Zhouyi Divination</title>
    <link rel="icon" href="./assets/zhouyi/lacquer-bagua-table.png" />
    <link rel="stylesheet" href="./styles-zhouyi.css?v=20260701-assistant1" />
  </head>
  <body data-method="liuyao">
    <div class="page-backdrop" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <a class="seal-link" href="./index.html" aria-label="返回星幕塔罗">
          <span></span>
        </a>
        <div class="brand-lockup">
          <h1>玄衡易台</h1>
          <p>以铜钱、六宫与梅花数起课；看结构与变化，也保留现实判断。</p>
        </div>
        <nav class="topbar-actions" aria-label="页面操作">
          <a class="ghost-button" href="./index.html">星幕塔罗</a>
          <button class="ghost-button" id="apiOpenButton" type="button">补写设置</button>
        </nav>
      </header>

      <main class="workspace">
        <aside class="control-rail" aria-label="起课设置">
          <div class="method-tabs" id="methodTabs"></div>

          <label class="question-field">
            <span>所问之事</span>
            <textarea
              id="questionInput"
              rows="4"
              maxlength="180"
              placeholder="例如：这件事下一步宜进还是宜守？目前最该先确认什么？"
            ></textarea>
          </label>

          <div id="methodControls"></div>

          <div class="action-row" id="actionRow"></div>
          <p class="status-line" id="statusLine" data-tone="neutral">请选择法门并起课。</p>
        </aside>

        <section class="stage-panel" aria-label="卦象盘">
          <div class="stage-canvas" id="divinationStage"></div>
        </section>
      </main>

      <section class="result-toolbar" aria-label="结果操作">
        <button class="ghost-button" id="copyButton" type="button" disabled>复制解读</button>
        <button class="ghost-button" id="saveButton" type="button" disabled>留存</button>
        <button class="primary-button subtle" id="aiButton" type="button" disabled>补充解读</button>
      </section>

      <section class="result-area" id="resultArea" aria-live="polite"></section>

      <details class="record-panel" hidden>
        <summary>起课记录</summary>
        <pre id="recordView">尚未起课。</pre>
      </details>
    </div>

    <dialog id="apiDialog" class="modal-shell">
      <form method="dialog">
        <button class="modal-close" type="submit" aria-label="关闭">×</button>
      </form>
      <h2>周易起课解读助手</h2>
      <p>默认关闭。启用后只根据本次卦象、动爻、六宫或体用关系补充文字；配置保存在当前浏览器。</p>
      <div class="api-grid">
        <label>
          <span>供应商</span>
          <select id="providerSelect"></select>
        </label>
        <label>
          <span>模型</span>
          <input id="apiModelInput" autocomplete="off" />
        </label>
        <label class="wide-field">
          <span>接口地址</span>
          <input id="apiEndpointInput" autocomplete="off" />
        </label>
        <label>
          <span>API key</span>
          <input id="apiKeyInput" type="password" autocomplete="off" placeholder="仅保存到本机浏览器" />
        </label>
        <label>
          <span>状态</span>
          <select id="apiEnabledSelect">
            <option value="off">关闭</option>
            <option value="on">启用周易补充解读</option>
          </select>
        </label>
        <label class="wide-field">
          <span>卦象提示词</span>
          <textarea id="apiPromptInput" rows="5"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button class="primary-button" id="saveApiConfig" type="button">保存设置</button>
        <button class="ghost-button" id="clearApiConfig" type="button">清除设置</button>
      </div>
      <p class="api-note" id="providerNote"></p>
    </dialog>

    <script type="module" src="./src/ui/zhouyiApp.js?v=20260701-assistant1"></script>
  </body>
</html>
